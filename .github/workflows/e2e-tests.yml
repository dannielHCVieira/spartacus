name: E2E Tests - Cypress

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:

env:
  CYPRESS_CACHE_FOLDER: .cache/cypress

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ${{ env.CYPRESS_CACHE_FOLDER }}
          key: ${{ runner.os }}-node-cypress-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-cypress-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build --if-present
        continue-on-error: true
      
      - name: Run E2E Tests
        run: npx cypress run --spec "projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/focus-management.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/keyboard-navigation.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/otp-login-tabbing.e2e-spec-flaky.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/product-configurator-tabbing.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/quote-tabbing.e2e-2211.FP4.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/scroll-to-top-button.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/accessibility/tabbing-order.e2e-spec-flaky.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/account-summary/b2b-account-summary.e2e-spec-flaky.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/asm/asm-cost-center.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/asm/asm.core-e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/asm/customer-list.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/asm/customer360-promotion.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/bulk-pricing/bulk-pricing.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/checkout/b2b-account-checkout-flow.core-e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/checkout/b2b-credit-card-checkout-flow.core-e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/future-stock/future-stock.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/my-company/a11y.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/my-company/units.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/order-approval/b2b-order-approval.e2e.cy.ts,projects/storefrontapp-e2e-cypress/cypress/e2e/b2b/regression/order-history/b2b-order-history-orders-flow.e2e.c